<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Price Calculator</title>

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flag-icon-css/3.5.0/css/flag-icon.min.css"/>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

</head>
<body>
  <div class="container mt-3">

    
    <!-- Exchange Rate Display -->
    <div id="exchangeRateDisplay" class="alert alert-info text-center" role="alert">
      Ziraat Katılım Satış: <span id="exchangeRate">-</span>
    </div>

    <!-- Button Group for Regions -->
    <div class="btn-group mb-3" role="group" aria-label="Region selection">
      <a href="#" id="usButton" class="btn  active flag-icon flag-icon-us" data-code="US"></a>
      <a href="#" id="euButton" class="btn  flag-icon flag-icon-eu" data-code="EU"></a>
      <a href="#" id="aeButton" class="btn  flag-icon flag-icon-ae" data-code="AE"></a>
      <a href="#" id="caButton" class="btn  flag-icon flag-icon-ca" data-code="CAD"></a>
      <a href="#" id="saButton" class="btn  flag-icon flag-icon-sa" data-code="SA"></a>
    </div>
    <!-- US Form -->
    <div id="usForm" class="region-form active">
      <form id="priceForm">
        <div class="form-row">
          <div class="form-group col-md-6">
            <label for="sellerPrice">Seller Price (TL):</label>
            <input type="number" class="form-control" id="sellerPrice" name="sellerPrice" step="0.01">
          </div>
          <div class="form-group col-md-6">
            <label for="shipping">Shipping (USD):</label>
            <input type="number" class="form-control" id="shipping" name="shipping" step="0.01">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group col-md-6">
            <label for="salesPriceUSD">Sales Price (USD):</label>
            <input type="number" class="form-control" id="salesPriceUSD" name="salesPriceUSD" step="0.01">
          </div>
          <div class="form-group col-md-6">
            <label for="comt">Comission Rate (%):</label>
            <input type="number" class="form-control" id="comt" name="comt" step="0.01">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group col-md-6">
            <label>Seller Price USD:</label>
            <span id="splLabel" class="badge badge-info d-block text-center p-2">0</span>
          </div>
          <div class="form-group col-md-6">
            <label>Comission %:</label>
            <span id="comLabel" class="badge badge-info d-block text-center p-2">0</span>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group col-md-6">
            <label>VAT:</label>
            <span id="ratioLabel" class="badge badge-info d-block text-center p-2">0</span>
          </div>
          <div class="form-group col-md-6">
            <label>Total Cost:</label>
            <span id="tcLabel" class="badge badge-info d-block text-center p-2">0</span>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group col-md-6">
            <label>Net Profit:</label>
            <span id="netProfitLabel" class="badge badge-info d-block text-center p-2">0</span>
          </div>
          <div class="form-group col-md-6">
            <label>Percent:</label>
            <span id="percentLabel" class="badge badge-info d-block text-center p-2">0%</span>
          </div>
        </div>
      </form>
    </div>
